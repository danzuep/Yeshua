name: Web site
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/src/main/assets/translations.csv'
      - '.github/scripts/web-smoke.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/src/main/assets/translations.csv'
      - '.github/scripts/web-smoke.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      translations:
        description: 'Comma separated eBible ids to publish'
        default: 'engwebu,cmn-ncvt'
      ruby_zip:
        description: 'Optional USFM zip URL with ruby text (e.g. a usfm-ruby release asset) used instead of the eBible zip of ruby_id'
        default: ''
      ruby_id:
        description: 'eBible id that ruby_zip replaces'
        default: 'cmn-ncvt'
      ruby_language:
        description: 'Language the annotator reads the ruby_id text as (zh-CN pinyin, zh-HK Jyutping, ja-JP, ko, vi, za)'
        default: 'zh-HK'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUBY_ID: ${{ inputs.ruby_id || 'cmn-ncvt' }}
      RUBY_LANGUAGE: ${{ inputs.ruby_language || 'zh-HK' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    # Adds Jyutping (or the ruby_language reading) to the ruby_id text, unless ruby_zip already supplies ruby USFM.
    - name: Download the USFM and Unihan readings
      if: inputs.ruby_zip == ''
      run: |
        mkdir ruby
        curl -fL "https://ebible.org/Scriptures/${RUBY_ID}_usfm.zip" -o "ruby/${RUBY_ID}_usfm.zip"
        curl -fL https://raw.githubusercontent.com/danzuep/PhoneticAnnotator/v0.2.0/data/Unihan_Readings.txt -o ruby/Unihan_Readings.txt
    - uses: actions/setup-dotnet@v6.1.0
      if: inputs.ruby_zip == ''
      with:
        dotnet-version: '10.0.x'
    - uses: danzuep/PhoneticAnnotator@v0.2.0
      if: inputs.ruby_zip == ''
      with:
        setup-dotnet: 'false'
        version: 0.2.0
        args: --data ruby/Unihan_Readings.txt --language ${{ env.RUBY_LANGUAGE }} --usfm-in ruby/${{ env.RUBY_ID }}_usfm.zip --usfm-out ruby/${{ env.RUBY_ID }}_ruby.zip
    - name: Build the site
      env:
        TRANSLATIONS: ${{ inputs.translations || 'engwebu,cmn-ncvt' }}
        RUBY_ZIP: ${{ inputs.ruby_zip || format('file://{0}/ruby/{1}_ruby.zip', github.workspace, env.RUBY_ID) }}
      run: |
        if [ -n "$RUBY_ZIP" ]; then TRANSLATIONS="${TRANSLATIONS/$RUBY_ID/$RUBY_ID=$RUBY_ZIP}"; fi
        ./gradlew :web:assembleSite -Ptranslations="$TRANSLATIONS"
    - name: Smoke test in headless Chromium
      run: |
        npm install --no-save playwright
        npx playwright install --with-deps chromium
        python3 -m http.server 8080 --directory web/build/site &
        sleep 2
        node .github/scripts/web-smoke.mjs http://localhost:8080/ web-smoke.png
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: web-smoke
        path: web-smoke.png
        if-no-files-found: ignore
    - uses: actions/upload-pages-artifact@v3
      with:
        path: web/build/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
