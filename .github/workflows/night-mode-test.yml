name: Night mode screenshot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/night-mode-test.yml
      - .github/scripts/theme-test.sh

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - name: Bundle a minimal World English Bible (John 1-2 and Hebrews 1-2 only)
      run: |
        mkdir -p bundled-assets/bundled/translations
        curl -fsSL "https://ebible.org/Scriptures/engwebu_usfm.zip" -o full-engwebu.zip
        bash .github/scripts/make-minimal-web.sh full-engwebu.zip bundled-assets/bundled/translations/engwebu.zip
        printf 'engwebu\tWorld English Bible Updated\teng\n' > bundled-assets/bundled/list.tsv
    - run: ./gradlew assembleDebug -PbundledAssetsDir="$PWD/bundled-assets"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        script: bash .github/scripts/theme-test.sh
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: night-results
        path: |
          theme-night.png
          theme-light.png
