name: Auto Tag
# Bumps the version tag when a PR is merged into main, based on the prefix of the PR title:
#   "major: ..." -> X+1.0.0, "minor: ..." -> X.Y+1.0, "patch: ..." -> X.Y.Z+1
# Any other title (including one with no prefix) does not create a tag or a release.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to create a version-code tag for
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.pull_request.merge_commit_sha }}
    - name: Create version-code tag and start release
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a release tag in vX.Y.Z format."
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          release_tag="$RELEASE_TAG"
          tag_commit=$(git rev-parse "$release_tag^{commit}")
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked out commit does not match $release_tag."
            exit 1
          fi
        else
          prefix=$(echo "$PR_TITLE" | sed -n -E 's/^[[:space:]]*(major|minor|patch):.*/\1/Ip' | tr 'A-Z' 'a-z')
          if [ -z "$prefix" ]; then
            echo "PR title has no major:/minor:/patch: prefix, so no tag is created."
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed -E 's/[-+][0-9]+$//' | sort -V | tail -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$prefix" in
            major) major=$((10#$major + 1)); minor=0; patch=0 ;;
            minor) minor=$((10#$minor + 1)); patch=0 ;;
            patch) patch=$((10#$patch + 1)) ;;
          esac
          release_tag="v$major.$minor.$patch"
          tag_commit=$(git rev-parse HEAD)
        fi

        version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
        release_tag="v$major.$minor.$patch+$version_code"
        existing_tag_commit=$(git ls-remote --tags origin "refs/tags/$release_tag" | cut -f1)
        if [[ -n "$existing_tag_commit" ]]; then
          if [[ "$existing_tag_commit" == "$tag_commit" ]]; then
            echo "Version tag $release_tag already exists."
            exit 0
          fi
          echo "Version tag $release_tag already points to a different commit."
          exit 1
        fi

        git tag "$release_tag" "$tag_commit"
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          git push origin "$release_tag"
        else
          git push origin "$release_tag"
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the release explicitly.
          gh workflow run release.yml --ref "$release_tag"
        fi
