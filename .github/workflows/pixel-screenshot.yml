name: Pixel 9 screenshots
on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_RUBY: '1'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/bundle-web
    - run: ./gradlew assembleRelease -PbundledAssetsDir="$PWD/bundled-assets"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_9
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: bash .github/scripts/pixel-screenshot.sh
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pixel9-screenshots
        path: |
          pixel9-*.png
          pixel9-*.xml
          logcat.txt
