name: Pixel 10 screenshot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pixel-screenshot.yml'
      - '.github/scripts/pixel-screenshot.sh'

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
    - uses: gradle/actions/setup-gradle@v6
    - uses: ./.github/actions/bundle-web
    - run: ./gradlew assembleRelease -PbundledAssetsDir="$PWD/bundled-assets"
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Update Android cmdline-tools for the Pixel 10 profile
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmdline-tools;latest"
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        profile: pixel_10
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
        script: bash .github/scripts/pixel-screenshot.sh
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pixel10-screenshots
        path: |
          pixel10-*.png
          pixel10-*.xml
          logcat.txt
